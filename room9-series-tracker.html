.hide{display:none}h2{font-size:16px;margin:18px 0 4px}li{margin:4px 0}.st{font-size:12px}

const CUTS=new Set([4,5,6,8,9,10,11,15,16,18,19,20,22,28,29]);
const isCut=n=>n>1&&CUTS.has(n);
const OPEN="Mira stands outside the motel lobby door in the rain, wet and frightened, wearing her mustard-yellow raincoat, looking toward the camera.";
function startNote(n){return n==1?`<b style="color:#ff4d4d">OPEN:</b> Flow → Video → Frames. Start frame = your Mira-at-the-door image (yellow jacket). Never start Clip 1 from text only.`:isCut(n)?`<b style="color:#ff4d4d">CUT:</b> do NOT use the last frame of Clip ${n-1}. Use Flow’s Ingredients mode: type @Mira / @Crane and add the location image.`:`<b style="color:#3ddc97">CHAIN:</b> start frame = last frame of Clip ${n-1} (or K${n-1}).`;}
function build(i){const[sc,ch,t]=CL[i],n=i+1;let p=[];
 if(inc.checked){p.push(STYLE);for(const c of ch)p.push(CH[c]);p.push(EV[sc]);}
 if(n==1)p.push("START STATE (this is exactly what the provided start frame shows; begin here): "+OPEN);
 else if(!isCut(n))p.push("START STATE (this is exactly what the provided start frame shows; begin here, do not change location, wardrobe or hairstyle): "+KF[i-1][2]);
 p.push("ACTION (ONE continuous shot, no cuts, no teleporting to another place; keep each character’s face, wardrobe and hairstyle exactly as in the start frame and the character references): "+t);
 p.push("END STATE (finish on this): "+KF[i][2]);
 return p.join("\n\n");}

guide.innerHTML=`<div class="card"><h2>How Flow works (from Google’s Flow help pages)</h2><ul>
<li><b>Characters:</b> in a project, left menu → Characters → New Character. One character per person. Only ONE image is required; Flow can then create the body for you (“Create body”). Google’s help page says “1 or 2 images”. You add a name, a voice and optional character info. In a prompt, type <code>@</code> and pick the name (for example @Mira).</li>
<li><b>Two video modes</b> (click the model name → Video): <b>Frames</b> (a start frame and an optional end frame) and <b>Ingredients</b> (characters, location images, voices).</li>
<li>Reference images work best on a <b>plain background</b>, and your text must not contradict your images.</li>
<li>Voice references work only in Ingredients mode with the Omni Flash model. Clips can be 4, 6, 8 or 10 seconds on Omni Flash: pick 10 s.</li>
<li>Scenebuilder in Flow can assemble clips into a sequence that you download as one file.</li>
<li>Not confirmed by me: whether @Mira can be used together with Frames. Test it once on Clip 1.</li></ul></div>
<div class="card"><h2>1. Chained clips (CHAIN)</h2><ol>
<li>Download the clip. Open the Frame grabber at the top of this page, choose the file, check the last frame is sharp (use “step back” if not), click Copy frame.</li>
<li>In Flow: Video → Frames. Paste the frame into “+ Add start frame”. Optionally add the matching K image as the end frame.</li>
<li>Paste the prompt from the Clips tab. It already says what the start frame shows (START STATE), what happens (ACTION) and where it ends (END STATE).</li>
<li>Pick the best take. Don’t continue from a clip whose last frame has a wrong face; regenerate it.</li>
<li>Write the take/file name in the note box and tick the clip.</li></ol></div>
<div class="card"><h2>2. New angle or place (CUT)</h2><ul>
<li>Do NOT use the last frame of the previous clip. Use Video → Ingredients: type @Mira and/or @Crane and add the location image.</li>
<li>Reason: the start frame beats everything else. A start frame from another place makes Flow blend two scenes.</li>
<li>Every prompt must match its start frame. Never write an action that begins somewhere different.</li></ul></div>
<div class="card"><h2>3. Character consistency</h2><ul>
<li>One Flow character per person (Mira, Crane), made from ONE image on a plain white background. Let Flow’s “Create body” make the body, then check it still matches. Never several characters for one person.</li>
<li>Keep the fixed details: Mira’s yellow raincoat, silver crescent necklace, name tag and scar on the LEFT eyebrow; Crane’s round wire glasses, grey slicked hair and long charcoal coat.</li>
<li>Faces drift in wide shots. Prefer medium and close shots.</li>
<li>Chaining many clips loses quality. Every 3 to 4 clips, re-anchor with an Ingredients clip using the characters.</li></ul></div>
<div class="card"><h2>4. Scene and story consistency</h2><ul>
<li>Keep the style lock and location text identical (the tracker adds them when “include style + character blocks” is ticked).</li>
<li>Locations: save the four location images in Storyboard and add the right one in Ingredients mode.</li>
<li>Generate in story order. Use the end-frame keyframes (K images) to keep important moments on target.</li>
<li>When editing: trim 0.2 to 0.4 s from the start of each clip to hide seams; add continuous rain and music under everything.</li></ul></div>
<div class="card"><h2>5. Voices</h2><ul>
<li>Choose a voice for Mira and a different one for Crane when you create the characters. The prompts already say fast and breathless; keep the quoted lines.</li>
<li>If a voice still changes between clips, re-record or replace it in your editor on the final cut.</li></ul></div>
<div class="card"><h2>6. Database</h2>Progress is stored in table <code>clip_progress</code> and images in <code>assets</code>. If the cloud is unreachable the page falls back to local storage. “Reset all” in the top bar clears progress (and optionally images). This file contains your database token: keep it private.</div>`;

const ITEMS=REFS.map(r=>({k:"ref:"+r[0],t:r[1],d:r[4],w:who(r[3],r[2]),p:ip(r[3],r[2],r[4])})).concat(KF.map((f,i)=>({k:"kf:"+(i+1),t:`K${i+1} · end frame of Clip ${i+1}`,d:f[2],w:who(f[0],f[1]),p:ip(f[0],f[1],f[2])})));
function who(sc,ch){return [...ch].map(c=>c=="M"?"Mira":"Crane").concat(sc?[AN[sc]]:[]).join(" + ")||"no people";}
const RULES=`You are my image-generation agent for a short suspense film project called ROOM 9. I will use your images as reference images and as start/end frames for AI video clips in Google Flow, so CONSISTENCY matters more than variety.

RULES
1. One image per request. 16:9 landscape, highest resolution available, photoreal cinematic look. No text, captions, watermarks, borders, collages or split panels (except the neon sign wording when a shot mentions it).
2. Identity lock: Mira and Mr. Crane must look identical in every image: same face, age, hair, glasses, scar, wardrobe, necklace, name tag. Once I approve a character reference image, use it as the identity source for every later image. Never redesign them.
3. Location lock: keep each location’s layout identical. Lobby: long wooden desk in the foreground with the brass bell, big rain-streaked window on the LEFT facing the lot, old CRT CCTV monitor by the window, wall-mounted CCTV monitor and wooden key rack on the RIGHT wall. Corridor: green wallpaper, door 9 at the far end. Room 9: iron bed centre, closet on the left wall, nightstand on the right. Exterior: L-shaped motel, neon sign on a pole.
4. Style lock: apply the STYLE LOCK below to every image so the colour grade, rain, grain and lighting never change.
5. Work in order: first the reference sheets (M1 and C1 on a plain white studio background, head and shoulders; L1-L4 locations; OPEN). Show me them and wait for my approval of one version of each character. Then generate the keyframes K1-K29 in order, using the approved references.
6. If a face is off-model, a hand is distorted or the wardrobe is wrong, regenerate before showing me.
7. Suspense comes from light, shadow and facial expression. No gore. Keep faces highly expressive.
8. Name each output by its ID, for example ref-M1, kf-05, so I can upload it to the right slot.`;
function masterBrief(){return RULES+"\n\nSTYLE LOCK:\n"+IMG+"\n\nCHARACTERS:\n"+CH.M+"\n"+CH.C+"\n\nLOCATIONS:\n"+Object.values(EV).join("\n")+"\n\nSHOT LIST (each is its own image; each keyframe is the END frame of a video clip and the START frame of the next):\n"+ITEMS.map(x=>`[${x.k.replace("ref:","ref-").replace("kf:","kf-")}] ${x.t} (${x.w}): ${x.d}`).join("\n");}
function ip(sc,ch,t){const p=[(!sc&&ch)?REFSTYLE:IMG];for(const c of ch)p.push(CH[c]);if(sc)p.push(EV[sc]);p.push("SHOT: "+t);return p.join("\n\n");}
let AS={};
async function loadAssets(){try{await sql("CREATE TABLE IF NOT EXISTS assets(key TEXT PRIMARY KEY,data TEXT)");(await sql("SELECT key,data FROM assets")).forEach(r=>AS[r[0]]=r[1]);}catch(e){}renderStory();render();}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const w=Math.min(768,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",.82));};im.src=URL.createObjectURL(f);});}
async function putAsset(k,f){const d=await shrink(f);AS[k]=d;try{await sql("INSERT INTO assets(key,data) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET data=excluded.data",[k,d]);}catch(e){alert("Shown here, but cloud save failed.");}renderStory();render();}
function copyImg(k,b){const im=new Image();im.onload=async()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);const bl=await new Promise(r=>c.toBlob(r,"image/png"));try{await navigator.clipboard.write([new ClipboardItem({"image/png":bl})]);const o=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=o,1200);}catch(e){alert("Clipboard blocked");}};im.src=AS[k];}
function renderStory(){story.innerHTML=`<button class="p" data-mb="1">Copy master brief for your image AI agent</button><div class="sub" style="margin:8px 0">Generate each image with its prompt, then upload it here. It is saved to your database. Order: reference sheets first, then keyframes. Each keyframe = the END frame of that clip and the START frame of the next.</div>`+
 ITEMS.map((x,i)=>`${i==0?'<div class="act">Reference sheets</div>':i==REFS.length?'<div class="act">Keyframes</div>':""}<div class="card ${AS[x.k]?"done":""}"><div class="top"><span class="n">${x.t}</span><span style="flex:1"></span>${AS[x.k]?`<button data-ci="${x.k}">Copy image</button>`:""}<button class="p" data-ip="${i}">Copy prompt</button><input type="file" accept="image/*" data-up="${x.k}" style="max-width:170px"></div><div class="sub" style="margin:6px 0">${x.d}</div>${AS[x.k]?`<img src="${AS[x.k]}" style="max-width:280px;border-radius:8px">`:""}</div>`).join("");}
document.addEventListener("click",e=>{const b=e.target;if(b.dataset.mb)copy(masterBrief(),b);if(b.dataset.ip)copy(ITEMS[b.dataset.ip].p,b);if(b.dataset.ci)copyImg(b.dataset.ci,b);});
document.addEventListener("change",e=>{const k=e.target.dataset.up;if(k&&e.target.files[0])putAsset(k,e.target.files[0]);});

function att(k){return AS[k]?`<button data-ci="${k}">Copy ${lab(k)}</button> <a class="sub" style="color:var(--ok)" href="${AS[k]}" download="${k.replace(":","-")}.jpg">save file</a>`:`<span class="sub">⚠ ${lab(k)} is not saved yet</span>`;}
