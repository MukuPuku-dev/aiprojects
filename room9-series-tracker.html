<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ROOM 9 moved</title></head>
<body>
<p>ROOM 9 has moved into Story Studio. Opening the new workspace…</p>
<script>
const saved = {};
try {
  for (const key of ["r9", "r9-current-clip", "r9ar"]) {
    const value = localStorage.getItem(key);
    if (value !== null) saved[key] = value;
  }
} catch (error) {
  alert("Could not read local ROOM 9 progress before moving: " + error.message);
}
const query = Object.keys(saved).length ? "?restore=" + encodeURIComponent(JSON.stringify(saved)) : "";
location.replace("projects/room-9/index.html" + query);
</script>
</body>
</html>
