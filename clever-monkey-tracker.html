<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Clever Monkey moved</title></head>
<body>
<p>The Clever Monkey has moved into Story Studio. Opening the new workspace…</p>
<script>
const saved = {};
try {
  for (const key of ["clevermonkey", "p2-current-clip", "p2-ar"]) {
    const value = localStorage.getItem(key);
    if (value !== null) saved[key] = value;
  }
} catch (error) {
  alert("Could not read local Clever Monkey progress before moving: " + error.message);
}
const query = Object.keys(saved).length ? "?restore=" + encodeURIComponent(JSON.stringify(saved)) : "";
location.replace("projects/clever-monkey/index.html" + query);
</script>
</body>
</html>
