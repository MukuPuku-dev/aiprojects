**DAY ${index+1}: ${day.title.toUpperCase()}**

${qlines}

 $("#prev").disabled=current===0;$("#next").disabled=current===29;
 $("#progress").style.width=((current+1)/30*100)+"%";$("#stats").textContent=`दिन ${current+1} / ३० चयन गरिएको · जम्मा ${DAYS.reduce((n,x)=>n+x.qs.length,0)} प्रश्न`;
 document.querySelectorAll(".daybtn").forEach((b,i)=>b.classList.toggle("selected",i===current));
}
function escapeHtml(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function copy(s){navigator.clipboard.writeText(s).then(()=>toast("Prompt clipboard मा copy भयो!")).catch(()=>{const t=document.createElement("textarea");t.value=s;document.body.append(t);t.select();document.execCommand("copy");t.remove();toast("Prompt copy भयो!");})}
function toast(s){$("#toast").textContent=s;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),1800)}
function list(){
 const term=$("#search").value.trim().toLowerCase();
 $("#days").innerHTML=DAYS.map((d,i)=>({d,i})).filter(x=>(x.d.title+" "+x.d.qs.flat().join(" ")).toLowerCase().includes(term)).map(({d,i})=>`<article class="day ${i===current?"active":""}"><div class="top"><b>Day ${String(i+1).padStart(2,"0")}</b><button class="daybtn ${i===current?"selected":""}" data-i="${i}">खोल्नुहोस्</button></div><h3>${d.title}</h3><div class="muted">३ प्रश्न · ${d.qs.map(q=>q[0]).join(" / ")}</div></article>`).join("");
 document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{current=+b.dataset.i;render();list();window.scrollTo({top:0,behavior:"smooth"});});
}
$("#copyCurrent").onclick=()=>copy(promptFor(DAYS[current],current));
$("#copyAll").onclick=()=>copy(DAYS.map((d,i)=>promptFor(d,i)).join("\n\n"+"=".repeat(65)+"\n\n"));
$("#prev").onclick=()=>{current=Math.max(0,current-1);render();list()};
$("#next").onclick=()=>{current=Math.min(29,current+1);render();list()};
$("#ratio").onchange=render;$("#search").oninput=list;
$("#download").onclick=()=>{const blob=new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gk-questions-30-days.html";a.click();URL.revokeObjectURL(a.href)};
render();list();
</script></main></body></html>
