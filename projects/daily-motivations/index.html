<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Motivations – Flow Series Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12100f;--card:#1e1a18;--ink:#f6f1ee;--mut:#b3a69f;--acc:#ff8f5a;--ok:#62d99a;--line:#3a312d;--ne:"Noto Sans Devanagari","Mukta","Nirmala UI","Mangal",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:#12100fee;backdrop-filter:blur(7px);padding:12px 16px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0;font-size:19px}h1 .ne{font-family:var(--ne);font-weight:700;color:var(--acc)}
h2{margin:18px 0 6px;font-size:17px}h3{margin:14px 0 4px;font-size:15px}
.sub{color:var(--mut);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{background:#2c2420;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button.p{background:var(--acc);color:#2a1004;border-color:var(--acc);font-weight:700}
button.on{border-color:var(--acc)}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav a{color:var(--acc);padding:7px 4px}
main{max-width:920px;margin:0 auto;padding:14px}
.hide{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;scroll-margin-top:150px}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card.done{opacity:.72}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.day{background:var(--acc);color:#2a1004;font-weight:800;border-radius:7px;padding:1px 9px;font-size:13px}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12px;color:var(--mut)}
.chip .ne{font-family:var(--ne)}
.top label{margin-left:auto;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;cursor:pointer}
.q{font-family:var(--ne);font-size:22px;line-height:1.55;font-weight:700;margin:6px 0 4px}
.en{color:var(--mut);font-style:italic;margin:0 0 4px}
.scene{font-size:13px;margin:6px 0 10px}.scene b{color:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.gen{font-size:13px;min-height:1em;margin-top:6px;opacity:.85}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;background:#0f0c0b;border:1px solid var(--line);border-radius:10px;padding:10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.filters button{font-size:13px;padding:5px 10px}.filters .ne{font-family:var(--ne)}
ol,ul{padding-left:20px}li{margin:4px 0}
.note{border-left:3px solid var(--acc);padding:6px 12px;background:#1a1512;border-radius:0 8px 8px 0;margin:10px 0}
button.tt,button[data-act="tiktok"]{background:#182120;color:#9df2d2;border-color:#2b5446;font-weight:700}
button.fb,button[data-act="facebook"]{background:#1877f2;color:#ffffff;border-color:#1877f2;font-weight:700;display:inline-flex;align-items:center}
button.fb:hover,button[data-act="facebook"]:hover{background:#166fe5;border-color:#166fe5}
button.tg,button[data-act="telegram"]{background:#229ED9;color:#ffffff;border-color:#229ED9;font-weight:700;display:inline-flex;align-items:center}
button.tg:hover,button[data-act="telegram"]:hover{background:#1d8ec4;border-color:#1d8ec4}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ok);color:#062014;font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media(max-width:560px){.q{font-size:19px}}
</style></head><body>
<header>
<h1>🔥 DAILY MOTIVATIONS · <span class="ne">दैनिक प्रेरणा</span> <span class="sub" id="st"></span></h1>
<div class="sub">Nepali motivation shorts · 30 videos × 10 seconds · complete video with Nepali voice-over generated in Google Flow (Omni)</div>
<div class="bar"><i id="pb"></i></div>
<nav>
<button class="p" id="nx">Copy NEXT prompt</button>
<button data-t="vids" class="on">Videos</button>
<button data-t="flow">Workflow</button>
<button data-t="guide">Style &amp; Rules</button>
<button id="dl">Download all prompts (.txt)</button>
<a href="../../index.html">← All projects</a>
<label class="sub">Shape <select id="ar"><option value="9:16">9:16 vertical</option><option value="16:9">16:9 wide</option></select></label>
<label class="sub">Model <select id="model"><option>Omni 1.1 Flash</option><option>Omni 1.2 Flash</option><option>Veo 3.1 - Lite</option><option>Veo 3.1 - Fast</option><option>Veo 3.1 - Quality</option></select></label>
<label class="sub">Length <select id="dur"><option>4s</option><option>6s</option><option>8s</option><option>10s</option></select></label>
<label class="sub" style="display:inline-flex;gap:5px;align-items:center;cursor:pointer" title="Default off: auto-post to TikTok right after Flow finishes"><input type="checkbox" id="autoPostToggle"> Auto-post TikTok</label>
<label class="sub" style="display:inline-flex;gap:5px;align-items:center;cursor:pointer" title="Default off: auto-post to Facebook right after Flow finishes"><input type="checkbox" id="autoPostFacebookToggle"> Auto-post Facebook</label>
<label class="sub" style="display:inline-flex;gap:5px;align-items:center;cursor:pointer" title="Auto-send video &amp; caption to Telegram right after Flow finishes"><input type="checkbox" id="autoPostTelegramToggle"> Auto-send Telegram</label>
<span class="sub" id="api"></span>
</nav>
</header>
<main>
<section id="vids"><div class="filters" id="filters"></div><div id="list"></div></section>
<section id="flow" class="hide"></section>
<section id="guide" class="hide"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="../../platform/project-storage.js"></script>
<script src="../../platform/workspace-social.js"></script>
<script src="flow-data.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const DIG="०१२३४५६७८९";const neNum=n=>String(n).split("").map(d=>DIG[+d]).join("");
const PROJECT_ID="daily-motivations";
const KEY="dailymotivations-v1";
const AUTO_POST_KEY="story_studio_auto_post_tiktok";
let S={done:{},ar:"9:16",model:"Omni 1.1 Flash",dur:"10s",filter:"all",cur:0,tab:"vids"};
const GEN={};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function pushCloud(){
  const checked={...(S.done||{})};
  const completedCount=VIDEOS.filter((_,i)=>checked[i+1]).length;
  window.StoryStudioStorage?.saveProjectProgress?.(PROJECT_ID,{totalClips:VIDEOS.length,completedCount,checked,state:S});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushCloud()}

function buildPrompt(i){return motivationPromptFor(i,S.ar)}
function buildCaption(i){const v=VIDEOS[i];const tags=["#प्रेरणा","#दैनिकप्रेरणा","#नेपाल","#NepaliMotivation","#Motivation"];if(v.t===5)tags.push("#लोकसेवा","#परीक्षातयारी");
return v.q+"\n\n🔥 दैनिक प्रेरणा · दिन "+neNum(i+1)+"\n\nयो भिडियो साथीहरूसँग सेयर गर्नुहोस् र हरेक दिन नयाँ प्रेरणा पाउन फलो गर्नुहोस्। 🙏\n\n"+tags.join(" ")}

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch(e){const a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}toast(msg||"Copied ✓")}

/* ---------- Videos tab ---------- */
function renderFilters(){
  const all=[{k:"all",ne:"सबै",en:"All"},...THEMES];
  $("#filters").innerHTML=all.map(t=>`<button data-f="${t.k}" class="${S.filter===t.k?"on":""}"><span class="ne">${esc(t.ne)}</span> · ${esc(t.en)}</button>`).join("");
}
function renderList(){
  $("#list").innerHTML=VIDEOS.map((v,i)=>({v,i})).filter(({v})=>S.filter==="all"||THEMES[v.t].k===S.filter).map(({v,i})=>{
    const th=THEMES[v.t];const done=!!S.done[i+1];
    return `<article class="card ${done?"done":""} ${S.cur===i?"cur":""}" id="v${i}" data-i="${i}">
<div class="top"><span class="day">Day ${i+1}</span><span class="chip"><span class="ne">${esc(th.ne)}</span> · ${esc(th.en)}</span>
<label><input type="checkbox" data-done="${i}" ${done?"checked":""}> Made in Flow</label></div>
<div class="q" lang="ne">${esc(v.q)}</div>
<p class="en">${esc(v.en)}</p>
<p class="scene"><b>Scene:</b> ${esc(v.scene)}</p>
<div class="btns"><button class="p" data-act="gen" data-i="${i}">Generate video</button><button data-act="tiktok" data-i="${i}" title="Post clip to TikTok">♪ Post TikTok</button><button data-act="facebook" data-i="${i}" title="Post clip to Facebook"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="vertical-align:-1px;margin-right:4px" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>Post Facebook</button><button data-act="telegram" data-i="${i}" title="Send clip &amp; caption to Telegram">✈ Send Telegram</button><button data-act="prompt" data-i="${i}">Copy Flow prompt</button>
<button data-act="line" data-i="${i}">Copy Nepali line</button>
<button data-act="cap" data-i="${i}">Copy post caption</button></div>
<div class="gen" id="g${i}">${esc(GEN[i]||"")}</div>
<details><summary>Show the complete video prompt</summary><pre>${esc(buildPrompt(i))}</pre></details></article>`}).join("");
}
function progress(){const n=Object.keys(S.done).filter(k=>S.done[k]).length;$("#pb").style.width=(n/VIDEOS.length*100)+"%";$("#st").textContent=n+"/"+VIDEOS.length+" made · "+(n*10)+"s of footage"}
function nextIndex(){for(let i=0;i<VIDEOS.length;i++)if(!S.done[i+1])return i;return -1}

$("#list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;const i=+b.dataset.i;S.cur=i;save();
  if(b.dataset.act==="gen"){genVideo(i);return}
  if(b.dataset.act==="tiktok"||b.dataset.act==="facebook"||b.dataset.act==="telegram"){postSocial(b.dataset.act,i);return}
  if(b.dataset.act==="prompt")copy(buildPrompt(i),"Flow prompt copied ✓");
  if(b.dataset.act==="line")copy(VIDEOS[i].q,"Nepali line copied ✓");
  if(b.dataset.act==="cap")copy(buildCaption(i),"Caption copied ✓");
  document.querySelectorAll(".card.cur").forEach(c=>c.classList.remove("cur"));$("#v"+i)&&$("#v"+i).classList.add("cur");
});
$("#list").addEventListener("change",e=>{
  const c=e.target.closest("input[data-done]");if(!c)return;const i=+c.dataset.done;
  if(c.checked)S.done[i+1]=true;else delete S.done[i+1];save();progress();
  c.closest(".card").classList.toggle("done",c.checked);
});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button[data-f]");if(!b)return;S.filter=b.dataset.f;save();renderFilters();renderList()});
$("#nx").onclick=()=>{
  const i=nextIndex();if(i<0){toast("All 30 videos are marked made 🎉");return}
  S.cur=i;S.filter="all";save();show("vids");renderFilters();renderList();
  copy(buildPrompt(i),"Day "+(i+1)+" prompt copied ✓");
  const el=$("#v"+i);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
};
$("#ar").onchange=e=>{S.ar=e.target.value;S.picked=true;save();renderList()};
$("#model").value=S.model;$("#dur").value=S.dur;
$("#model").onchange=e=>{S.model=e.target.value;S.picked=true;save()};
$("#dur").onchange=e=>{S.dur=e.target.value;S.picked=true;save()};
const GEN_API="http://127.0.0.1:8787";
const isFile=location.protocol==="file:";
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{S=Object.assign(S,JSON.parse(e.newValue));$("#model").value=S.model;$("#dur").value=S.dur;$("#ar").value=S.ar;renderFilters();renderList();progress()}catch(err){toast("Could not read updated progress: "+err.message)}
});
// Uses the Flow defaults from tools/flow/settings.json until this page's model, aspect or duration is changed.
async function applyFlowDefaults(){
  if(isFile)return;
  try{
    const r=await fetch("/api/flow-settings?project=daily-motivations");const j=await r.json();
    if(!r.ok||!j.ok)return;
    if(S.picked)return;
    S.model=j.effective.video.model;S.ar=j.effective.video.aspect;S.dur=j.effective.video.duration;save();
    $("#model").value=S.model;$("#dur").value=S.dur;$("#ar").value=S.ar;renderList();progress();
  }catch(e){}
}
function setGen(i,msg){GEN[i]=msg;const el=$("#g"+i);if(el)el.textContent=msg}
async function checkApi(){
  const el=$("#api");
  if(isFile){el.textContent="Generator: open via "+GEN_API+"/projects/daily-motivations/";return}
  try{const r=await fetch("/api/health");if(!r.ok)throw new Error();el.textContent="Generator: online"}
  catch(e){el.textContent="Generator: offline (double-click Start Story Studio.vbs in aiprojects)"}
}
function socialContextFor(i){const v=VIDEOS[i];return `Nepali motivational video, day ${i+1}. Spoken line: ${v.q}\nMeaning: ${v.en}\nScene: ${v.scene}`}
async function postSocial(platform,i){
  if(isFile){toast(`Open ${GEN_API}/projects/daily-motivations/ to post to ${platform}`);return}
  const btn=document.querySelector(`button[data-act="${platform}"][data-i="${i}"]`);
  if(btn)btn.disabled=true;
  const label=platform==="facebook"?"Facebook":platform==="telegram"?"Telegram":"TikTok";
  try{
    await window.StoryStudioSocial.postMedia({platform,projectId:PROJECT_ID,day:i+1,context:socialContextFor(i),label:`Day ${i+1}`,onStatus:m=>setGen(i,m)});
    setGen(i,`Posted to ${label} ✓`);toast(`Day ${i+1} posted to ${label} ✓`);
  }catch(err){setGen(i,`${label} failed: ${err.message}`);toast(`${label} upload failed.`);}
  finally{if(btn)btn.disabled=false}
}
async function genVideo(i){
  if(isFile){toast("Open "+GEN_API+"/projects/daily-motivations/ to generate");return}
  const btn=document.querySelector('button[data-act="gen"][data-i="'+i+'"]');
  if(btn)btn.disabled=true;
  setGen(i,"Generating in Flow… this can take several minutes. Keep the Flow Chrome window open.");
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project:"daily-motivations",day:i+1,prompt:buildPrompt(i),model:S.model,aspect:S.ar,duration:S.dur})});
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||"Generation failed");
    setGen(i,"Saved to "+j.file);
    S.done[i+1]=true;save();progress();renderList();setGen(i,"Saved to "+j.file);toast("Day "+(i+1)+" video saved ✓");
    await window.StoryStudioSocial?.autoPostAfterFlow?.({projectId:PROJECT_ID,day:i+1,context:socialContextFor(i),tiktokEnabled:Boolean($("#autoPostToggle")?.checked),facebookEnabled:Boolean($("#autoPostFacebookToggle")?.checked),telegramEnabled:Boolean($("#autoPostTelegramToggle")?.checked),label:`Day ${i+1}`,onStatus:m=>setGen(i,m),onToast:toast});
  }catch(err){setGen(i,"Failed: "+err.message);toast("Generation failed. See the status line.")}
  finally{if(btn)btn.disabled=false}
}
checkApi();
applyFlowDefaults();
window.StoryStudioSocial?.initAutoPostToggles?.({projectId:PROJECT_ID,tiktokSelector:"#autoPostToggle",facebookSelector:"#autoPostFacebookToggle",telegramSelector:"#autoPostTelegramToggle",onToast:toast});
$("#dl").onclick=()=>{
  const txt=VIDEOS.map((v,i)=>"=== DAY "+(i+1)+" ===\nNepali line: "+v.q+"\nMeaning: "+v.en+"\n\nCOMPLETE FLOW VIDEO + VOICE-OVER PROMPT:\n"+buildPrompt(i)+"\n\nPOST CAPTION:\n"+buildCaption(i)+"\n").join("\n\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));a.download="daily-motivations-prompts.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

/* ---------- Workflow + Guide tabs ---------- */
$("#flow").innerHTML=`
<h2>How each video gets made</h2>
<div class="note">Each video is one complete 10-second Flow generation: the cinematic picture, Nepali motivational voice-over, music, and sound effects are all requested in the same prompt. No separate voice tool or editing step is needed. The prompt keeps Devanagari text out of the picture to avoid garbled on-screen writing.</div>
<ol>
<li><b>Generate the finished video.</b> Pick the Model (Omni 1.1 Flash by default) and Length (10s), and the Shape (9:16 for Reels/Shorts). Then tap <i>Generate video</i> on a day. First, double-click <code>Start Story Studio.vbs</code> in the <code>aiprojects</code> folder and open Daily Motivations from the studio. The MP4 is saved to <code>projects/daily-motivations/videos/</code>. Manual alternative: tap <i>Copy Flow prompt</i> and paste it into Flow exactly as copied. The prompt includes that video's Nepali voice-over script and audio directions.</li>
<li><b>Judge the first second.</b> If frame 1 would not stop your thumb mid-scroll, regenerate. Each take differs, so keep the best of 2 or 3.</li>
<li><b>Check the generated audio.</b> Make sure the Nepali line is spoken clearly and the voice sits above the music. If the generator omits or garbles it, regenerate with the same complete prompt.</li>
<li><b>Post the finished clip.</b> No separate editing step is required. Use <i>Copy post caption</i> for the social post, and tick <i>Made in Flow</i> to track progress.</li>
</ol>
<h3>Batching tip</h3>
<p>Generate 5 clips in one sitting, edit them together, then schedule one a day. Use <i>Copy NEXT prompt</i> to jump to the first video not yet ticked.</p>`;

$("#guide").innerHTML=`
<h2>Shared prompt rules</h2>
<p class="sub">These shared blocks and each video's Nepali voice-over script are combined in its complete Flow prompt.</p>
<h3>Style lock</h3><pre>${esc(STYLE)}</pre>
<h3>Pacing and camera</h3><pre>${esc(PACE)}</pre>
<h3>Audio</h3><pre>${esc(AUDIO)}</pre>
<h3>Format (9:16 shown)</h3><pre>${esc(FORMAT("9:16"))}</pre>
<h2>Rules that keep it cinematic</h2>
<ul>
<li>Every clip opens on a pattern-interrupt in the first second: an extreme close-up, a strange angle or an explosion of motion.</li>
<li>Fast action first, then <b>one</b> slow-motion hero moment, then a still, beautiful final shot. Too many slow-motion beats make it feel slow again.</li>
<li>One continuous shot with no hard cuts, so people and places stay consistent inside the clip.</li>
<li>The last 2 seconds keep calm space in the upper third for your caption.</li>
<li>No real people, brands, logos or signs in the picture. The prompts describe fictional Nepali characters.</li>
<li>For a recurring hero across many videos, upload the same character reference image as an Ingredient in Flow.</li>
<li>If Flow omits or garbles the Nepali voice-over, adds character dialogue, or renders on-screen text, regenerate.</li>
</ul>
<h2>The lines</h2>
<p>All 30 Nepali lines are included verbatim in their corresponding Flow prompts as the voice-over script.</p>`;

/* ---------- tabs ---------- */
function show(t){S.tab=t;document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("hide",s.id!==t));document.querySelectorAll("nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
document.querySelectorAll("nav button[data-t]").forEach(b=>b.onclick=()=>show(b.dataset.t));

$("#ar").value=S.ar;renderFilters();renderList();progress();show("vids");
window.StoryStudioStorage?.syncWorkspaceProgress?.({
  projectId:PROJECT_ID,totalClips:VIDEOS.length,
  readLocal:()=>({checked:{...(S.done||{})},state:S,hasLocal:Object.keys(S.done||{}).length>0,completedCount:VIDEOS.filter((_,i)=>S.done[i+1]).length}),
  applyMerged:(checked,mergedState)=>{S=Object.assign(S,mergedState||{},{done:checked||{}});try{localStorage.setItem(KEY,JSON.stringify(S))}catch{};renderFilters();renderList();progress();}
});
</script></body></html>
