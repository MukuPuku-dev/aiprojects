async function ensureAsset(k){if(AS[k])return AS[k];if(!assetIndexLoaded)await loadAssets();if(!savedAssetKeys.has(k))return null;const result=await projectStorage.getAssets([k],cleverLegacyKeys);Object.assign(AS,result.assets);if(AS[k])updateStoryAsset(k);else if(result.error)setAssetStatus(k,"Could not load. Select Retry.");return AS[k]||null;}
function clipPrompt(i){const [loc,chars,action]=clips[i];const who=[...chars].map(k=>CH[k]).join("\n\n");const ar=document.getElementById("ar").value==="9:16";return "SHOT — one continuous 10-second clip, fast and punchy:\n"+action+"\n\nCHARACTERS — keep exact designs from the reference images:\n"+who+"\n\n"+LOC[loc]+"\n\n"+STYLE+"\n\n"+PACE+"\n\n"+AUDIO+"\n\nFORMAT: "+(ar?"9:16 vertical, composed for a phone screen: subject large and centered, action stacked vertically, tight punchy framing":"16:9 landscape, wide cinematic framing")+". Exactly 10 seconds, no hard cuts. Clean frame with no on-screen text, subtitles, captions, logos or watermarks. Keep character scale, colors, environment layout and screen direction identical to the references.";}
function stat(){const d=Object.entries(S).filter(([k,x])=>+k<=clips.length&&x.done).length;pb.style.width=d/clips.length*100+"%";st.textContent="· "+d+"/"+clips.length+" clips · "+Math.floor(d/6)+"m"+d%6*10+"s done · "+(online?"☁ synced":"⚠ local/cloud offline");}
async function save(n){const s=S[n];try{localStorage.setItem("clevermonkey",JSON.stringify(S))}catch(_){}try{await sql("INSERT INTO clip_progress(ep,n,done,note) VALUES(?,?,?,?) ON CONFLICT(ep,n) DO UPDATE SET done=excluded.done,note=excluded.note",[EP,n,s.done?1:0,s.note||""]);online=true}catch(e){online=false}stat();}
async function load(){try{S=JSON.parse(localStorage.getItem("clevermonkey")||"{}")}catch(e){S={}}render();renderStory();renderPrep();try{await sql("CREATE TABLE IF NOT EXISTS clip_progress(ep INTEGER,n INTEGER,done INTEGER DEFAULT 0,note TEXT DEFAULT '',PRIMARY KEY(ep,n))");const rows=await sql("SELECT n,done,note FROM clip_progress WHERE ep=?",[EP]);S={};rows.forEach(r=>S[r[0]]={done:+r[1],note:r[2]||""});online=true;}catch(e){online=false;}render();}
function getCurrent(){let n=0;try{n=+(localStorage.getItem("p2-current-clip")||0)}catch(_){}if(n>=1&&n<=clips.length)return n;const i=clips.findIndex((_,i)=>!(S[i+1]||{}).done);return i>=0?i+1:clips.length;}
function setCurrent(n,scroll=false){n=Math.max(1,Math.min(clips.length,+n||1));try{localStorage.setItem("p2-current-clip",String(n))}catch(_){}if(scroll){const el=document.getElementById("c"+n);if(el)el.scrollIntoView({behavior:"auto",block:"start"});}}
function render(){document.getElementById("clips").innerHTML=clips.map((x,i)=>{const n=i+1,s=S[n]||{},isNext=!s.done&&clips.slice(0,i).every((_,j)=>(S[j+1]||{}).done);const keys=[...new Set([x[0],...x[1]])];return '<div class="card '+(s.done?"done ":"")+(isNext?"next":"")+'" id="c'+n+'"><div class="top"><span class="n">CLIP '+String(n).padStart(2,"0")+' / '+clips.length+' · '+["","Opening","Friendship","The trap","The clever escape","Reconciliation"][Math.min(5,Math.ceil(n/5))]+'</span><span class="pill">'+x[0]+'</span><span style="flex:1"></span><label class="sub"><input type="checkbox" data-d="'+n+'" '+(s.done?"checked":"")+'> done</label><button class="p" data-c="'+n+'">Copy prompt</button></div><div class="asset-buttons">'+keys.map(k=>'<button data-ci="'+k+'">Copy '+({M:"Mango",C:"Croc",W:"Mrs. Croc",T:"Tree",R:"River",H:"Home",B:"River crossing",G:"Tree roots"}[k])+' image</button>').join("")+'</div><div>'+x[2]+'</div><pre>'+clipPrompt(i).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre><label class="sub">Your notes / generation status</label><textarea data-note="'+n+'" rows="2">'+(s.note||"")+'</textarea></div>'}).join("");stat();}
function copy(txt,b){navigator.clipboard.writeText(txt).then(()=>{if(b){const old=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=old,1100)}})}
function renderPrep(){document.getElementById("prep").innerHTML='<div class="card"><h2>Project 2 — The Clever Monkey</h2><p>A funny, colorful retelling of the classic monkey-and-crocodile fable. Mango shares fruit with Croc, they become best friends, Croc’s greedy wife demands the monkey’s heart, and Mango saves himself with a clever trick. Every clip is designed for character dialogue—no voice-over at all.</p><ol><li>Create a separate Google Flow project named <b>The Clever Monkey</b>.</li><li>Choose 9:16 for TikTok / Reels / Shorts. Use 16:9 only if you want a landscape version. Keep the same ratio for all clips.</li><li>Go to Storyboard & Images and create the three character references first: Mango, Croc and Mrs. Croc. Then create the four main location references.</li><li>For each clip, attach the relevant character and location images using the buttons on that clip card. Use the previous clip’s final frame as the start frame when it naturally continues; use a fresh character/location setup for a deliberate cut.</li><li>Generate each clip at 10 seconds (Flow Omni model). The dialogue is inside the shot description, not narration. If Flow makes the wrong character speak, shorten the spoken line and regenerate.</li></ol><button class="p" data-t="story">Open Storyboard & Images</button> <button class="p" data-t="clips">Start with Clip 1</button></div><div class="card"><h2>Story in five acts</h2><ol><li><b>Fruit and friendship (Clips 1–7):</b> Mango shares rose apples; Croc and Mango become friends.</li><li><b>The greedy idea (Clips 8–11):</b> Mrs. Croc loves the fruit and decides she wants Mango’s heart.</li><li><b>The dangerous ride (Clips 12–15):</b> Croc invites Mango home, then confesses in the middle of the river.</li><li><b>The clever escape (Clips 16–19):</b> Mango pretends his heart is in the tree and leaps to safety.</li><li><b>Funny ending (Clips 20–24):</b> Croc apologizes; Mrs. Croc gets fruit instead; friendship and a joke finish the story.</li></ol></div>';}
function renderStory(){document.getElementById("story").innerHTML='<div class="card"><h2>Storyboard & reference images</h2><p class="sub">Click Paste image on a slot, then press Ctrl+V anywhere on the page. Or choose an image file. Images stay within this project and load only as needed.</p>'+(document.getElementById("story").dataset.assetError?'<p class="sub">Image index is temporarily unavailable. Cached images still work. <button data-refresh-assets>Retry connection</button></p>':'')+'</div>'+assetDefs.map(([k,title,ch,prompt])=>'<div class="card" data-asset-card="'+k+'"><div class="top"><b>'+title+'</b><span style="flex:1"></span><button class="p" data-ic="'+k+'">Copy image prompt</button><button data-ci="'+k+'">Copy saved image</button><button data-paste="'+k+'">Paste image</button><label class="sub">Choose file <input type="file" accept="image/*" data-up="'+k+'" style="max-width:170px"></label></div><pre>'+prompt+'</pre><span class="sub" data-asset-status>'+(AS[k]?"Saved image":savedAssetKeys.has(k)?"Saved · loading when visible":assetIndexLoaded?"No image saved yet":"Checking saved images…")+'</span><div data-asset-preview>'+(AS[k]?'<img loading="lazy" decoding="async" class="img" src="'+AS[k]+'">':'')+'</div></div>').join('')+'<div class="card"><h2>Key scene order</h2><p>1–7 fruit friendship · 8–11 greedy wife · 12–15 dangerous invitation · 16–19 clever escape · 20–24 apology and comedy.</p></div>';observeStoryAssets();}
function startPaste(k){activePasteKey=k;document.querySelectorAll("[data-paste]").forEach(b=>{const active=b.dataset.paste===k;b.textContent=active?"Press Ctrl+V":"Paste image";b.classList.toggle("on",active);});}
function renderGuide(){document.getElementById("guide").innerHTML='<div class="card"><h2>Visual style lock</h2><p>'+STYLE+'</p><h2>Audio rule — absolutely no voice-over</h2><p>All spoken words must come directly from a visible character. No narrator, no voice-over, no internal monologue, no off-screen storyteller. The named speaker’s mouth moves in sync with that character’s own dialogue; other characters react silently until their turn. Keep lines short enough to fit in a 10-second clip. Include water, fruit, footsteps and jungle ambience, but no added voices.</p><h2>Character continuity</h2><ul><li>Mango always has golden-brown fur, cream muzzle/belly, curled tail, dark hair tuft and turquoise scarf.</li><li>Croc always has emerald scales, mint belly, rounded friendly snout and orange shell necklace.</li><li>Mrs. Croc always has lime belly, eyelashes, purple flower and gold bangles.</li><li>Rose apples are shiny red. Keep the same tree on the same riverbank. Croc swims; Mango rides on his back. The monkey escapes onto the tree on the near bank.</li></ul><h2>Flow tips for hooking, cinematic clips</h2><ul><li>Every clip prompt is a timed shot list (0–1s HOOK, then slow-motion and fast beats). Paste it exactly as copied and do not add extra instructions.</li><li>Use the Omni model (10-second clips) for the final takes.</li><li>Attach the character and location images as Ingredients and use the last frame of the previous clip as the start frame only when the action truly continues. For a new setup, start fresh with the references.</li><li>If the wrong character speaks, or a line is cut off, shorten the line and regenerate. Speech can be dropped when it does not fit inside the clip.</li><li>If it still feels slow, regenerate once or twice (every take differs) and keep the best hook. If subtitles appear, regenerate; the prompt already forbids on-screen text.</li></ul><p><a href="https://deepmind.google/models/veo/prompt-guide/" target="_blank" rel="noopener" style="color:var(--acc)">Official Veo prompt guide</a> · <a href="https://support.google.com/flow/answer/16353334" target="_blank" rel="noopener" style="color:var(--acc)">Google Flow guide</a></p></div>';}
async function shrink(f){return new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{try{const w=Math.min(768,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;const context=c.getContext("2d");if(!context)throw new Error("Could not prepare the image.");context.drawImage(im,0,0,w,h);resolve(c.toDataURL("image/jpeg",.82));}catch(error){reject(error);}finally{URL.revokeObjectURL(url);}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Could not read the selected image."));};im.src=url;});}
async function putAsset(k,f){try{const d=await shrink(f);AS[k]=d;savedAssetKeys.add(k);await sql("CREATE TABLE IF NOT EXISTS assets(key TEXT PRIMARY KEY,data TEXT)");await projectStorage.saveAsset(k,d);renderStory();render();}catch(e){alert("Image is available in this tab, but cloud save failed.\n\n"+(e&&e.message?e.message:String(e))+"\n\nPlease try again when the connection is available.");}}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return; if(b.dataset.paste){startPaste(b.dataset.paste);return;} if(b.dataset.c){setCurrent(b.dataset.c);copy(clipPrompt(+b.dataset.c-1),b)}if(b.dataset.ci){try{const data=await ensureAsset(b.dataset.ci);if(!data){alert("No saved image was found for "+b.dataset.ci+".");return;}const response=await fetch(data);const blob=await response.blob();await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);}catch(error){alert("Could not copy image: "+error.message);}}if(b.dataset.ic){copy(assetDefs.find(x=>x[0]===b.dataset.ic)[3],b)}if(b.dataset.t){["prep","clips","story","guide"].forEach(k=>document.getElementById(k).classList.toggle("hide",k!==b.dataset.t));document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));if(b.dataset.t==="clips")setCurrent(getCurrent(),true);if(b.dataset.t==="story"){renderStory();loadAssets()}}if(b.dataset.retryAsset){loadingAssetKeys.delete(b.dataset.retryAsset);ensureAsset(b.dataset.retryAsset);}if(b.dataset.refreshAssets){assetIndexLoaded=false;document.getElementById("story").dataset.assetError="";loadAssets()}if(b.id==="nx"){const i=clips.findIndex((_,i)=>!(S[i+1]||{}).done);if(i<0)return;setCurrent(i+1);document.querySelector('[data-t="clips"]').click();copy(clipPrompt(i),b);document.getElementById("c"+(i+1)).scrollIntoView({behavior:"auto",block:"start"})}if(b.id==="rs"&&confirm("Reset Project 2 clip progress and notes?")){S={};clips.forEach((_,i)=>save(i+1));render();setCurrent(1,true)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.d){const n=+t.dataset.d;S[n]=S[n]||{note:""};S[n].done=t.checked?1:0;save(n);if(t.checked){const i=clips.findIndex((_,j)=>!(S[j+1]||{}).done);setCurrent(i<0?clips.length:i+1)}else setCurrent(n);render();if(!document.getElementById("clips").classList.contains("hide"))setCurrent(getCurrent(),true)}if(t.dataset.up&&t.files[0]){activePasteKey=null;putAsset(t.dataset.up,t.files[0])}if(t.dataset.note){const n=+t.dataset.note;S[n]=S[n]||{done:0,note:""};S[n].note=t.value;save(n)}if(t.id==="ar")localStorage.setItem("p2-ar",t.value)});
document.addEventListener("paste",async e=>{const k=activePasteKey;if(!k)return;const cd=e.clipboardData||window.clipboardData;const it=Array.from((cd&&cd.items)||[]).find(x=>x.type&&x.type.startsWith("image/"));if(!it)return;e.preventDefault();await putAsset(k,it.getAsFile());activePasteKey=null;renderStory();});

window.addEventListener("scroll",()=>{if(document.getElementById("clips").classList.contains("hide"))return;const cards=document.querySelectorAll("#clips .card[id^='c']");for(const el of cards){const r=el.getBoundingClientRect();if(r.top<=180&&r.bottom>180){setCurrent(el.id.slice(1));break}}},{passive:true});
try{ar.value=localStorage.getItem("p2-ar")||"9:16"}catch(_){}
renderGuide();load();
</script></body></html>
