let savedAssetKeys=new Set(),assetIndexLoaded=false,assetIndexRequest=null,assetObserver=null,pendingAssetKeys=new Set(),assetLoadTimer=null,loadingAssetKeys=new Set(),clipEndFramesRequest=null,clipEndFramesLoaded=false;
function endFrameKey(n){return "clip-end-"+String(n).padStart(2,"0");}
const clipEndFrameKeys=clips.map((_,i)=>endFrameKey(i+1));
const cleverAssetKeys=assetDefs.map(x=>x[0]),cleverLegacyKeys=Object.fromEntries(cleverAssetKeys.map(k=>[k,k]));
async function loadAssets(){if(assetIndexRequest)return assetIndexRequest;if(assetIndexLoaded)return;assetIndexRequest=(async()=>{try{const result=await projectStorage.listAssets(cleverAssetKeys,cleverLegacyKeys);savedAssetKeys=result.keys;assetIndexLoaded=!result.error;document.getElementById("story").dataset.assetError=result.error?"true":"";if(result.error)throw result.error;if(!document.getElementById("story").classList.contains("hide"))renderStory();}catch(e){document.getElementById("story").dataset.assetError="true";if(!document.getElementById("story").classList.contains("hide"))renderStory();console.warn("Clever Monkey image index is unavailable:",e);}finally{assetIndexRequest=null;}})();return assetIndexRequest;}
function queueAssetLoad(k){if(AS[k]||loadingAssetKeys.has(k)||!savedAssetKeys.has(k))return;pendingAssetKeys.add(k);clearTimeout(assetLoadTimer);assetLoadTimer=setTimeout(flushAssetQueue,60);}
async function flushAssetQueue(){const keys=[...pendingAssetKeys];pendingAssetKeys.clear();if(!keys.length)return;keys.forEach(k=>loadingAssetKeys.add(k));const result=await projectStorage.getAssets(keys,cleverLegacyKeys);Object.assign(AS,result.assets);keys.forEach(k=>loadingAssetKeys.delete(k));if(!document.getElementById("story").classList.contains("hide")){keys.forEach(updateStoryAsset);if(result.error)keys.forEach(k=>setAssetStatus(k,"Could not load. Select Retry."));}}
function observeStoryAssets(){if(assetObserver)assetObserver.disconnect();assetObserver="IntersectionObserver" in window?new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;const card=entry.target;assetObserver.unobserve(card);queueAssetLoad(card.dataset.assetCard);}),{rootMargin:"300px 0px"}):null;document.querySelectorAll("#story [data-asset-card]").forEach(card=>{if(AS[card.dataset.assetCard])updateStoryAsset(card.dataset.assetCard);else if(assetObserver)assetObserver.observe(card);else queueAssetLoad(card.dataset.assetCard);});}
function setAssetStatus(k,text){const card=Array.from(document.querySelectorAll("#story [data-asset-card]")).find(x=>x.dataset.assetCard===k);if(!card)return;const status=card.querySelector("[data-asset-status]");if(!status)return;status.replaceChildren(document.createTextNode(text));if(text.includes("Retry")){const retry=document.createElement("button");retry.dataset.retryAsset=k;retry.textContent="Retry";status.append(" ",retry);}}
function updateStoryAsset(k){const card=Array.from(document.querySelectorAll("#story [data-asset-card]")).find(x=>x.dataset.assetCard===k);if(!card)return;const data=AS[k],preview=card.querySelector("[data-asset-preview]");if(preview){preview.replaceChildren();if(data){const img=document.createElement("img");img.loading="lazy";img.decoding="async";img.alt="Saved storyboard image for "+k;img.src=data;img.className="img";preview.append(img);}}setAssetStatus(k,data?"Saved image":"Could not load. Select Retry.");}
async function ensureAsset(k){if(AS[k])return AS[k];if(k.startsWith("clip-end-")){const result=await projectStorage.getAssets([k]);Object.assign(AS,result.assets);if(!AS[k]&&result.error)throw result.error;return AS[k]||null;}if(!assetIndexLoaded)await loadAssets();if(!savedAssetKeys.has(k))return null;const result=await projectStorage.getAssets([k],cleverLegacyKeys);Object.assign(AS,result.assets);if(AS[k])updateStoryAsset(k);else if(result.error)setAssetStatus(k,"Could not load. Select Retry.");return AS[k]||null;}
function clipPrompt(i){const [loc,chars,action]=clips[i];const who=[...chars].map(k=>CH[k]).join("\n\n");const ar=document.getElementById("ar").value==="9:16";return "SHOT — one continuous 10-second clip, fast and punchy, fully silent storytelling (no dialogue):\n"+action+"\n\nCHARACTERS — keep exact designs from the reference images:\n"+who+"\n\n"+LOC[loc]+"\n\n"+STYLE+"\n\n"+PACE+"\n\n"+AUDIO+"\n\nFORMAT: "+(ar?"9:16 vertical, composed for a phone screen: subject large and centered, action stacked vertically, tight punchy framing":"16:9 landscape, wide cinematic framing")+". Exactly 10 seconds, no hard cuts. Clean frame with no on-screen text, subtitles, captions, logos or watermarks. Keep character scale, colors, environment layout and screen direction identical to the references.";}
function stat(){const d=Object.entries(S).filter(([k,x])=>+k<=clips.length&&x.done).length;pb.style.width=d/clips.length*100+"%";st.textContent="· "+d+"/"+clips.length+" clips · "+Math.floor(d/6)+"m"+d%6*10+"s done · "+(online?"☁ synced":"⚠ local/cloud offline");}
async function save(n){const s=S[n];try{localStorage.setItem("clevermonkey",JSON.stringify(S))}catch(_){}try{await sql("INSERT INTO clip_progress(ep,n,done,note) VALUES(?,?,?,?) ON CONFLICT(ep,n) DO UPDATE SET done=excluded.done,note=excluded.note",[EP,n,s.done?1:0,s.note||""]);online=true}catch(e){online=false}stat();}
async function load(){try{S=JSON.parse(localStorage.getItem("clevermonkey")||"{}")}catch(e){S={}}render();renderStory();renderPrep();try{await sql("CREATE TABLE IF NOT EXISTS clip_progress(ep INTEGER,n INTEGER,done INTEGER DEFAULT 0,note TEXT DEFAULT '',PRIMARY KEY(ep,n))");const rows=await sql("SELECT n,done,note FROM clip_progress WHERE ep=?",[EP]);S={};rows.forEach(r=>S[r[0]]={done:+r[1],note:r[2]||""});online=true;}catch(e){online=false;}render();}
function getCurrent(){let n=0;try{n=+(localStorage.getItem("p2-current-clip")||0)}catch(_){}if(n>=1&&n<=clips.length)return n;const i=clips.findIndex((_,i)=>!(S[i+1]||{}).done);return i>=0?i+1:clips.length;}
function setCurrent(n,scroll=false){n=Math.max(1,Math.min(clips.length,+n||1));try{localStorage.setItem("p2-current-clip",String(n))}catch(_){}if(scroll){const el=document.getElementById("c"+n);if(el)el.scrollIntoView({behavior:"auto",block:"start"});}}
function render(){document.getElementById("clips").innerHTML=clips.map((x,i)=>{const n=i+1,s=S[n]||{},isNext=!s.done&&clips.slice(0,i).every((_,j)=>(S[j+1]||{}).done),ek=endFrameKey(n);const keys=[...new Set([x[0],...x[1]])];return '<div class="card '+(s.done?"done ":"")+(isNext?"next":"")+'" id="c'+n+'"><div class="top"><span class="n">CLIP '+String(n).padStart(2,"0")+' / '+clips.length+' · '+["","Opening","Friendship","The trap","The clever escape","Reconciliation"][Math.min(5,Math.ceil(n/5))]+'</span><span class="pill">'+x[0]+'</span><span style="flex:1"></span><label class="sub"><input type="checkbox" data-d="'+n+'" '+(s.done?"checked":"")+'> done</label><button class="p" data-c="'+n+'">Copy prompt</button></div><div class="asset-buttons">'+keys.map(k=>'<button data-ci="'+k+'">Copy '+({M:"Mango",C:"Croc",W:"Mrs. Croc",T:"Tree",R:"River",H:"Home",B:"River crossing",G:"Tree roots"}[k])+' image</button>').join("")+'</div><div>'+x[2]+'</div><p class="sub">Choose the ending-frame image below; on the next clip, copy this frame to continue the motion.</p><div class="asset-buttons"><label class="sub">Save end frame <input type="file" accept="image/*" data-end-up="'+n+'" style="max-width:180px"></label>'+(n>1?'<button data-ci="'+endFrameKey(n-1)+'">Copy Clip '+(n-1)+' end frame</button>':'')+'<span class="sub" data-end-status="'+n+'">'+(AS[ek]?"End frame saved":savedAssetKeys.has(ek)?"Saved end frame · loading…":"No end frame saved")+'</span></div><div data-end-preview="'+n+'">'+(AS[ek]?'<img loading="lazy" decoding="async" class="img" alt="Saved end frame for clip '+n+'" src="'+AS[ek]+'">':'')+'</div><pre>'+clipPrompt(i).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre><label class="sub">Your notes / generation status</label><textarea data-note="'+n+'" rows="2">'+(s.note||"")+'</textarea></div>'}).join("");stat();}
function copy(txt,b){navigator.clipboard.writeText(txt).then(()=>{if(b){const old=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=old,1100)}})}
function renderPrep(){document.getElementById("prep").innerHTML='<div class="card"><h2>Project 2 — The Clever Monkey</h2><p>A funny, colorful, fully silent retelling of the classic monkey-and-crocodile fable. Mango shares fruit with Croc, they become best friends, Croc’s greedy wife demands the monkey’s heart, and Mango saves himself with a clever trick. Every clip is told visually, with no dialogue and no voice-over at all.</p><ol><li>Create a separate Google Flow project named <b>The Clever Monkey</b>.</li><li>Choose 9:16 for TikTok / Reels / Shorts. Use 16:9 only if you want a landscape version. Keep the same ratio for all clips.</li><li>Go to Storyboard & Images and create the three character references first: Mango, Croc and Mrs. Croc. Then create the four main location references.</li><li>For each clip, attach the relevant character and location images using the buttons on that clip card. Use the previous clip’s final frame as the start frame when it naturally continues; use a fresh character/location setup for a deliberate cut.</li><li>Generate each clip at 10 seconds (Flow Omni model). There is no dialogue: characters tell the story with faces, gestures and mime. If a character starts talking or lips flap, or text appears on screen, regenerate the clip.</li></ol><button class="p" data-t="story">Open Storyboard & Images</button> <button class="p" data-t="clips">Start with Clip 1</button></div><div class="card"><h2>Story in five acts</h2><ol><li><b>Fruit and friendship (Clips 1–7):</b> Mango shares rose apples; Croc and Mango become friends.</li><li><b>The greedy idea (Clips 8–11):</b> Mrs. Croc loves the fruit and decides she wants Mango’s heart.</li><li><b>The dangerous ride (Clips 12–15):</b> Croc invites Mango home, then confesses in the middle of the river.</li><li><b>The clever escape (Clips 16–19):</b> Mango pretends his heart is in the tree and leaps to safety.</li><li><b>Funny ending (Clips 20–24):</b> Croc apologizes; Mrs. Croc gets fruit instead; friendship and a joke finish the story.</li></ol></div>';}
function renderStory(){document.getElementById("story").innerHTML='<div class="card"><h2>Storyboard & reference images</h2><p class="sub">Click Paste image on a slot, then press Ctrl+V anywhere on the page. Or choose an image file. Images stay within this project and load only as needed.</p>'+(document.getElementById("story").dataset.assetError?'<p class="sub">Image index is temporarily unavailable. Cached images still work. <button data-refresh-assets>Retry connection</button></p>':'')+'</div>'+assetDefs.map(([k,title,ch,prompt])=>'<div class="card" data-asset-card="'+k+'"><div class="top"><b>'+title+'</b><span style="flex:1"></span><button class="p" data-ic="'+k+'">Copy image prompt</button><button data-ci="'+k+'">Copy saved image</button><button data-paste="'+k+'">Paste image</button><label class="sub">Choose file <input type="file" accept="image/*" data-up="'+k+'" style="max-width:170px"></label></div><pre>'+prompt+'</pre><span class="sub" data-asset-status>'+(AS[k]?"Saved image":savedAssetKeys.has(k)?"Saved · loading when visible":assetIndexLoaded?"No image saved yet":"Checking saved images…")+'</span><div data-asset-preview>'+(AS[k]?'<img loading="lazy" decoding="async" class="img" src="'+AS[k]+'">':'')+'</div></div>').join('')+'<div class="card"><h2>Key scene order</h2><p>1–7 fruit friendship · 8–11 greedy wife · 12–15 dangerous invitation · 16–19 clever escape · 20–24 apology and comedy.</p></div>';observeStoryAssets();}
function startPaste(k){activePasteKey=k;document.querySelectorAll("[data-paste]").forEach(b=>{const active=b.dataset.paste===k;b.textContent=active?"Press Ctrl+V":"Paste image";b.classList.toggle("on",active);});}
function renderGuide(){document.getElementById("guide").innerHTML='<div class="card"><h2>Visual style lock</h2><p>'+STYLE+'</p><h2>Audio rule — no dialogue, no voice-over</h2><p>No spoken words of any kind. No dialogue, no narrator, no voice-over, no inner monologue, no off-screen storyteller. Characters act with faces, gestures and mime, plus short non-verbal sounds such as gasps, squeaks, gulps and giggles. Include water, fruit, footsteps and jungle ambience, bouncy cartoon sound effects and a cinematic music score, but no voices saying words. If speech or lip-flapping appears, regenerate.</p><h2>Character continuity</h2><ul><li>Mango always has golden-brown fur, cream muzzle/belly, curled tail, dark hair tuft and turquoise scarf.</li><li>Croc always has emerald scales, mint belly, rounded friendly snout and orange shell necklace.</li><li>Mrs. Croc always has lime belly, eyelashes, purple flower and gold bangles.</li><li>Rose apples are shiny red. Keep the same tree on the same riverbank. Croc swims; Mango rides on his back. The monkey escapes onto the tree on the near bank.</li></ul><h2>Flow tips for hooking, cinematic clips</h2><ul><li>Every clip prompt is a timed shot list (0–1s HOOK, then slow-motion and fast beats). Paste it exactly as copied and do not add extra instructions.</li><li>Use the Omni model (10-second clips) for the final takes.</li><li>Attach the character and location images as Ingredients and use the last frame of the previous clip as the start frame only when the action truly continues. For a new setup, start fresh with the references.</li><li>Every clip must be understandable with the sound off. If a mime or fantasy puff is unclear, regenerate once or twice (every take differs) and keep the clearest one.</li><li>If it still feels slow, regenerate once or twice and keep the best hook. If subtitles or on-screen text appear, regenerate; the prompt already forbids on-screen text.</li></ul><p><a href="https://deepmind.google/models/veo/prompt-guide/" target="_blank" rel="noopener" style="color:var(--acc)">Official Veo prompt guide</a> · <a href="https://support.google.com/flow/answer/16353334" target="_blank" rel="noopener" style="color:var(--acc)">Google Flow guide</a></p></div>';}
async function shrink(f){return new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{try{const w=Math.min(768,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;const context=c.getContext("2d");if(!context)throw new Error("Could not prepare the image.");context.drawImage(im,0,0,w,h);resolve(c.toDataURL("image/jpeg",.82));}catch(error){reject(error);}finally{URL.revokeObjectURL(url);}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Could not read the selected image."));};im.src=url;});}
async function clipboardPng(blob){const url=URL.createObjectURL(blob);try{const image=new Image(),loaded=new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error("Could not decode image for the clipboard."));});image.src=url;await loaded;const canvas=document.createElement("canvas");canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext("2d");if(!context)throw new Error("Could not prepare the image for the clipboard.");context.drawImage(image,0,0);const png=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!png||png.type!=="image/png")throw new Error("Could not convert the image to PNG.");return png;}finally{URL.revokeObjectURL(url);}}
async function loadClipEndFrames(){if(clipEndFramesLoaded)return;if(clipEndFramesRequest)return clipEndFramesRequest;clipEndFramesRequest=(async()=>{await loadAssets();const result=await projectStorage.getAssets(clipEndFrameKeys);Object.assign(AS,result.assets);render();let status=document.getElementById("clip-end-frame-status");if(!status){status=document.createElement("p");status.id="clip-end-frame-status";status.className="sub";document.getElementById("clips").prepend(status);}status.replaceChildren();if(result.error){status.append(document.createTextNode("Could not check cloud-saved end frames. Frames saved on this device are still available. "));const retry=document.createElement("button");retry.dataset.retryEndframes="true";retry.textContent="Retry";status.append(retry);}else{status.textContent="";clipEndFramesLoaded=true;}})().finally(()=>{clipEndFramesRequest=null;});return clipEndFramesRequest;}
async function saveClipEndFrame(n,file){try{const data=await shrink(file),key=endFrameKey(n);let localError=null;try{await projectStorage.saveAssetLocal(key,data);}catch(error){localError=error;}AS[key]=data;render();const status=document.querySelector('[data-end-status="'+n+'"]');try{await sql("CREATE TABLE IF NOT EXISTS assets(key TEXT PRIMARY KEY,data TEXT)");await projectStorage.saveAsset(key,data);if(status){status.textContent=localError?"Saved to cloud · local backup unavailable":"Saved on this device and cloud";status.title=localError?localError.message:"";}}catch(error){if(status){status.textContent=localError?"Could not save the end frame":"Saved on this device · cloud sync failed";status.title=(error&&error.message?error.message:String(error))+(localError?" · "+localError.message:"");}if(localError)alert("Could not save the end frame for Clip "+n+": "+status.title);}}catch(error){alert("Could not prepare the end frame for Clip "+n+": "+(error&&error.message?error.message:String(error)));}}
async function putAsset(k,f){try{const d=await shrink(f);AS[k]=d;savedAssetKeys.add(k);await sql("CREATE TABLE IF NOT EXISTS assets(key TEXT PRIMARY KEY,data TEXT)");await projectStorage.saveAsset(k,d);renderStory();render();}catch(e){alert("Image is available in this tab, but cloud save failed.\n\n"+(e&&e.message?e.message:String(e))+"\n\nPlease try again when the connection is available.");}}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return; if(b.dataset.paste){startPaste(b.dataset.paste);return;} if(b.dataset.c){setCurrent(b.dataset.c);copy(clipPrompt(+b.dataset.c-1),b)}if(b.dataset.ci){try{const data=await ensureAsset(b.dataset.ci);if(!data){alert("No saved image was found for "+b.dataset.ci+".");return;}const response=await fetch(data);const blob=await response.blob();const png=await clipboardPng(blob);await navigator.clipboard.write([new ClipboardItem({"image/png":png})]);}catch(error){alert("Could not copy image: "+error.message);}}if(b.dataset.ic){copy(assetDefs.find(x=>x[0]===b.dataset.ic)[3],b)}if(b.dataset.t){["prep","clips","story","guide"].forEach(k=>document.getElementById(k).classList.toggle("hide",k!==b.dataset.t));document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));if(b.dataset.t==="clips"){setCurrent(getCurrent(),true);loadClipEndFrames();}if(b.dataset.t==="story"){renderStory();loadAssets()}}if(b.dataset.retryAsset){loadingAssetKeys.delete(b.dataset.retryAsset);ensureAsset(b.dataset.retryAsset);}if(b.dataset.retryEndframes){clipEndFramesLoaded=false;loadClipEndFrames();}if(b.dataset.refreshAssets){assetIndexLoaded=false;document.getElementById("story").dataset.assetError="";loadAssets()}if(b.id==="nx"){const i=clips.findIndex((_,i)=>!(S[i+1]||{}).done);if(i<0)return;setCurrent(i+1);document.querySelector('[data-t="clips"]').click();copy(clipPrompt(i),b);document.getElementById("c"+(i+1)).scrollIntoView({behavior:"auto",block:"start"})}if(b.id==="rs"&&confirm("Reset Project 2 clip progress and notes?")){S={};clips.forEach((_,i)=>save(i+1));render();setCurrent(1,true)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.d){const n=+t.dataset.d;S[n]=S[n]||{note:""};S[n].done=t.checked?1:0;save(n);if(t.checked){const i=clips.findIndex((_,j)=>!(S[j+1]||{}).done);setCurrent(i<0?clips.length:i+1)}else setCurrent(n);render();if(!document.getElementById("clips").classList.contains("hide"))setCurrent(getCurrent(),true)}if(t.dataset.up&&t.files[0]){activePasteKey=null;putAsset(t.dataset.up,t.files[0])}if(t.dataset.endUp&&t.files[0])saveClipEndFrame(+t.dataset.endUp,t.files[0]);if(t.dataset.note){const n=+t.dataset.note;S[n]=S[n]||{done:0,note:""};S[n].note=t.value;save(n)}if(t.id==="ar")localStorage.setItem("p2-ar",t.value)});
document.addEventListener("paste",async e=>{const k=activePasteKey;if(!k)return;const cd=e.clipboardData||window.clipboardData;const it=Array.from((cd&&cd.items)||[]).find(x=>x.type&&x.type.startsWith("image/"));if(!it)return;e.preventDefault();await putAsset(k,it.getAsFile());activePasteKey=null;renderStory();});

function loadClipImagePreview(button){if(button.dataset.imagePreviewLoaded==="true"||button.dataset.imagePreviewLoading==="true")return;let preview=button.querySelector(".image-hover-preview");if(!preview){preview=document.createElement("span");preview.className="image-hover-preview";preview.setAttribute("aria-hidden","true");button.append(preview);}button.dataset.imagePreviewLoading="true";preview.textContent="Loading preview...";ensureAsset(button.dataset.ci).then(data=>{if(!button.isConnected)return;if(data){const image=document.createElement("img");image.alt="Preview of "+button.firstChild.textContent.trim().replace(/^Copy\s+/,"");image.src=data;preview.replaceChildren(image);button.dataset.imagePreviewLoaded="true";}else preview.textContent="No saved image";}).catch(error=>{if(!button.isConnected)return;preview.textContent="Preview unavailable";console.warn("Could not load clip image preview:",error);}).finally(()=>{delete button.dataset.imagePreviewLoading;});}
