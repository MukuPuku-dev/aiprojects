function clipPrompt(i){const [loc,chars,action]=clips[i];const who=[...chars].map(k=>CH[k]).join("\n\n");const dialogues=(action.match(/(?:MANGO|CROC|MRS\. CROC) says:[^\n]*/g)||[]).join("\n");return STYLE+"\n\nCHARACTER REFERENCES — preserve exact designs:\n"+who+"\n\n"+LOC[loc]+"\n\nSHOT AND ACTION: "+action+"\n\nAUDIO AND SPEAKER RULES: This is a dialogue-driven cartoon. NO NARRATOR, NO VOICE-OVER, NO INTERNAL MONOLOGUE. Only the named visible character(s) speak the exact lines written in the shot action; synchronize the correct character's mouth to their own words. Non-speaking characters keep their mouths still except for natural reactions. Use expressive faces, gestures, comedic pauses and clear turn-taking. Add only fitting jungle ambience, water splashes, fruit impacts and soft physical comedy sounds. Do not invent extra dialogue.\n\nFORMAT: exactly one 10-second animated video clip, "+(document.getElementById("ar").value==="9:16"?"9:16 vertical portrait":"16:9 landscape")+". One coherent shot or simple motivated camera move, not a montage. No subtitles, captions, text, logos or watermarks. Keep character scale, colors, accessories, environment geography and screen direction consistent. Dialogue must be short, clear, lively and intelligible.";
}

function renderPrep(){document.getElementById("prep").innerHTML='<div class="card"><h2>Project 2 — The Clever Monkey</h2><p>A funny, colorful retelling of the classic monkey-and-crocodile fable. Mango shares fruit with Croc, they become best friends, Croc’s greedy wife demands the monkey’s heart, and Mango saves himself with a clever trick. Every clip is designed for character dialogue—no voice-over at all.</p><ol><li>Create a separate Google Flow project named <b>The Clever Monkey</b>.</li><li>Choose 9:16 for TikTok / Reels / Shorts. Use 16:9 only if you want a landscape version. Keep the same ratio for all clips.</li><li>Go to Storyboard & Images and create the three character references first: Mango, Croc and Mrs. Croc. Then create the four main location references.</li><li>For each clip, attach the relevant character and location images using the buttons on that clip card. Use the previous clip’s final frame as the start frame when it naturally continues; use a fresh character/location setup for a deliberate cut.</li><li>Generate each clip as 10 seconds. The dialogue is inside the shot description, not narration. If Flow makes the wrong character speak, shorten the spoken line and regenerate.</li></ol><button class="p" data-t="story">Open Storyboard & Images</button> <button class="p" data-t="clips">Start with Clip 1</button></div><div class="card"><h2>Story in five acts</h2><ol><li><b>Fruit and friendship (Clips 1–7):</b> Mango shares rose apples; Croc and Mango become friends.</li><li><b>The greedy idea (Clips 8–11):</b> Mrs. Croc loves the fruit and decides she wants Mango’s heart.</li><li><b>The dangerous ride (Clips 12–15):</b> Croc invites Mango home, then confesses in the middle of the river.</li><li><b>The clever escape (Clips 16–19):</b> Mango pretends his heart is in the tree and leaps to safety.</li><li><b>Funny ending (Clips 20–24):</b> Croc apologizes; Mrs. Croc gets fruit instead; friendship and a joke finish the story.</li></ol></div>';}

function renderGuide(){document.getElementById("guide").innerHTML='<div class="card"><h2>Visual style lock</h2><p>'+STYLE+'</p><h2>Audio rule — absolutely no voice-over</h2><p>All spoken words must come directly from a visible character. No narrator, no voice-over, no internal monologue, no off-screen storyteller. The named speaker’s mouth moves in sync with that character’s own dialogue; other characters react silently until their turn. Keep lines short enough to fit in a 10-second clip. Include water, fruit, footsteps and jungle ambience, but no added voices.</p><h2>Character continuity</h2><ul><li>Mango always has golden-brown fur, cream muzzle/belly, curled tail, dark hair tuft and turquoise scarf.</li><li>Croc always has emerald scales, mint belly, rounded friendly snout and orange shell necklace.</li><li>Mrs. Croc always has lime belly, eyelashes, purple flower and gold bangles.</li><li>Rose apples are shiny red. Keep the same tree on the same riverbank. Croc swims; Mango rides on his back. The monkey escapes onto the tree on the near bank.</li></ul><h2>Flow tips</h2><p>Google recommends clear subject, action, style, framing and audio instructions, plus reference images for consistent characters. Add character/location images as ingredients and keep dialogue explicitly assigned to named speakers. If a clip has too much dialogue, simplify it rather than adding narration.</p><p><a href="https://deepmind.google/models/veo/prompt-guide/" target="_blank" rel="noopener" style="color:var(--acc)">Official Veo prompt guide</a> · <a href="https://support.google.com/flow/answer/16353334" target="_blank" rel="noopener" style="color:var(--acc)">Google Flow guide</a></p></div>';}
async function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const w=Math.min(768,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",.82));};im.src=URL.createObjectURL(f);});}
async function putAsset(k,f){try{const d=await shrink(f);const dbKey="p2:"+k;await sql("CREATE TABLE IF NOT EXISTS assets(key TEXT PRIMARY KEY,data TEXT)");await sql("INSERT INTO assets(key,data) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET data=excluded.data",[dbKey,d]);const saved=await sql("SELECT length(data) FROM assets WHERE key=?",[dbKey]);if(!saved.length||!Number(saved[0][0]))throw Error("Database did not confirm the saved image.");AS[k]=d;renderStory();render();}catch(e){alert("Image is visible only temporarily; database save failed.\n\n"+(e&&e.message?e.message:String(e))+"\n\nPlease try a smaller image or another file.");}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return; if(b.dataset.paste){startPaste(b.dataset.paste);return;} if(b.dataset.c){setCurrent(b.dataset.c);copy(clipPrompt(+b.dataset.c-1),b)}if(b.dataset.ci){const k=b.dataset.ci;if(AS[k]){fetch(AS[k]).then(r=>r.blob()).then(blob=>{const item=new ClipboardItem({"image/png":blob});navigator.clipboard.write([item])}).catch(()=>alert("Could not copy image. Open it from Storyboard instead."));}else alert("Create/upload this image in Storyboard first.");}if(b.dataset.ic){copy(assetDefs.find(x=>x[0]===b.dataset.ic)[3],b)}if(b.dataset.t){["prep","clips","story","guide"].forEach(k=>document.getElementById(k).classList.toggle("hide",k!==b.dataset.t));document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));if(b.dataset.t==="clips")setCurrent(getCurrent(),true);if(b.dataset.t==="story")loadLegacyProject2Assets()}if(b.id==="nx"){const i=clips.findIndex((_,i)=>!(S[i+1]||{}).done);if(i<0)return;setCurrent(i+1);document.querySelector('[data-t="clips"]').click();copy(clipPrompt(i),b);document.getElementById("c"+(i+1)).scrollIntoView({behavior:"auto",block:"start"})}if(b.id==="rs"&&confirm("Reset Project 2 clip progress and notes?")){S={};clips.forEach((_,i)=>save(i+1));render();setCurrent(1,true)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.d){const n=+t.dataset.d;S[n]=S[n]||{note:""};S[n].done=t.checked?1:0;save(n);if(t.checked){const i=clips.findIndex((_,j)=>!(S[j+1]||{}).done);setCurrent(i<0?clips.length:i+1)}else setCurrent(n);render();if(!document.getElementById("clips").classList.contains("hide"))setCurrent(getCurrent(),true)}if(t.dataset.up&&t.files[0]){activePasteKey=null;putAsset(t.dataset.up,t.files[0])}if(t.dataset.note){const n=+t.dataset.note;S[n]=S[n]||{done:0,note:""};S[n].note=t.value;save(n)}if(t.id==="ar")localStorage.setItem("p2-ar",t.value)});
document.addEventListener("paste",async e=>{const k=activePasteKey;if(!k)return;const cd=e.clipboardData||window.clipboardData;const it=Array.from((cd&&cd.items)||[]).find(x=>x.type&&x.type.startsWith("image/"));if(!it)return;e.preventDefault();await putAsset(k,it.getAsFile());activePasteKey=null;renderStory();});

window.addEventListener("scroll",()=>{if(document.getElementById("clips").classList.contains("hide"))return;const cards=document.querySelectorAll("#clips .card[id^='c']");for(const el of cards){const r=el.getBoundingClientRect();if(r.top<=180&&r.bottom>180){setCurrent(el.id.slice(1));break}}},{passive:true});
try{ar.value=localStorage.getItem("p2-ar")||"9:16"}catch(_){}
renderGuide();load();
</script></body></html>
