let state={done:{},ratio:"16:9",tab:"script"};try{state=Object.assign(state,JSON.parse(localStorage.getItem("loobh-le-labh")||"{}"))}catch(e){}
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("loobh-le-labh",JSON.stringify(state))}catch(e){}}
function prompt(e,c){let x=E[e].c[c],ids=x[3].split(" "),who=ids.map(id=>C[id]).join("\n");return "PROJECT: लोभले लाभ, लाभले विलाप — Nepali dialogue-led period drama.\nEPISODE "+(e+1)+" / CLIP "+(c+1)+"\nACTION: "+x[1]+"\nCHARACTERS:\n"+who+"\nLOCATION: "+LOC[x[0]]+"\nDIALOGUE — speak exactly, speaker labels not spoken:\n"+x[2].map(v=>"• "+v).join("\n")+"\nCONTINUITY: "+(e===0&&c===0?"Opening clip; establish the world and character references.":"Begin from the exact final frame of the previous clip; preserve positions, light, props and emotion.")+"\n"+STYLE+"\n"+CONT+"\n"+AUDIO+"\nFORMAT: exactly 10 seconds, "+state.ratio+" framing. No readable text, captions, logos or watermark."}
function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Prompt copied ✓")).catch(()=>fallback(t));else fallback(t)}
function fallback(t){let a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove();toast("Prompt copied ✓")}
function render(){let total=E.reduce((n,e)=>n+e.c.length,0),done=Object.values(state.done).filter(Boolean).length;$("#bar").style.width=(done/total*100)+"%";$("#count").textContent=done+"/"+total+" clips complete";
$("#script").innerHTML=E.map((e,i)=>'<section class="box"><h2>भाग '+(i+1)+' — '+esc(e.t)+'</h2><div class="muted">'+esc(e.s)+'</div>'+e.c.map((x,j)=>{let k=i+"-"+j;return '<article class="clip"><div class="top"><span class="tag">क्लिप '+(j+1)+' · १० सेकेन्ड</span><label><input type="checkbox" data-done="'+k+'" '+(state.done[k]?"checked":"")+'> पूरा भयो</label></div><p>'+esc(x[1])+'</p>'+x[2].map(v=>{let z=v.indexOf(":");return '<div class="line"><span class="speaker">'+esc(v.slice(0,z+1))+'</span>'+esc(v.slice(z+1))+'</div>'}).join("")+'<div class="tools"><button data-copy="'+k+'">Copy Flow prompt</button><button data-show="'+k+'">Show / hide prompt</button></div><pre class="prompt hide" id="p'+k+'">'+esc(prompt(i,j))+'</pre></article>'}).join("")+'</section>').join("");
$("#cast").innerHTML='<div class="box"><h2>पात्रहरूको स्थायी रूप</h2>'+Object.keys(C).map(k=>'<p><b>'+k+':</b> '+esc(C[k])+'</p>').join("")+'</div><div class="box"><h2>स्थानहरूको continuity</h2>'+Object.keys(LOC).map(k=>'<p><b>'+k+':</b> '+esc(LOC[k])+'</p>').join("")+'</div>';
$("#rules").innerHTML='<div class="box"><h2>कथा र उत्पादन निर्देशन</h2><p>यो लियो टोल्स्टोयको “How Much Land Does a Man Need?” कथाको संवादप्रधान नेपाली रूपान्तरण हो। दिदीबहिनीको बहस, पहिलो जमिन, छिमेकीसँगको विवाद, भोल्गा बसाइँ, बास्किरहरूको प्रस्ताव, सूर्योदयदेखि सूर्यास्तसम्मको दौड र छ फिटको चिहानजस्ता मुख्य घटना सुरक्षित राखिएका छन्। संवाद र जोड्ने दृश्यहरू भिडियोका लागि सिर्जनात्मक रूपमा लेखिएका हुन्।</p><ul><li>हरेक क्लिप ठीक १० सेकेन्ड र एउटै continuous shot।</li><li>कुनै narrator वा voice-over छैन; देखिएका पात्रले मात्र बोल्छन्।</li><li>नेपाली संवाद अक्षरशः बोल्ने; speaker label नबोल्ने र थप शब्द नथप्ने।</li><li>अघिल्लो क्लिपको अन्तिम frame अर्को क्लिपको start frame बनाउने।</li><li>पाहोमको लोभ बिस्तारै बढाउने; सुरुबाटै खलनायक नबनाउने।</li><li>अन्तिम दौडमा घामको दिशा र समय क्रमशः साँझतिर गएको देखाउने।</li><li>अन्तिम दृश्य शान्त, गम्भीर र भावनात्मक; हास्यास्पद प्रस्तुति होइन।</li></ul><p><b>मुख्य शिक्षा:</b> मानिसको आवश्यकता सीमित हुन्छ, तर लोभको कुनै सीमा हुँदैन।</p></div>'}
document.addEventListener("click",ev=>{let b=ev.target.closest("button");if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;["script","cast","rules"].forEach(id=>$("#"+id).classList.toggle("hide",id!==state.tab));document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===state.tab));save()}if(b.dataset.copy){let a=b.dataset.copy.split("-").map(Number);copy(prompt(a[0],a[1]))}if(b.dataset.show){$("#p"+b.dataset.show).classList.toggle("hide")}});
document.addEventListener("change",ev=>{if(ev.target.dataset.done!==undefined){state.done[ev.target.dataset.done]=ev.target.checked;save();render()}});
$("#next").onclick=()=>{for(let e=0;e<E.length;e++)for(let c=0;c<E[e].c.length;c++)if(!state.done[e+"-"+c]){copy(prompt(e,c));return}toast("सबै क्लिप पूरा भए")};
$("#ratio").value=state.ratio;$("#ratio").onchange=function(){state.ratio=this.value;save();render()};
$("#download").onclick=()=>{let blob=new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="loobh-le-labh.html";a.click();URL.revokeObjectURL(a.href)};
render();["script","cast","rules"].forEach(id=>$("#"+id).classList.toggle("hide",id!==state.tab));
</script></html>
